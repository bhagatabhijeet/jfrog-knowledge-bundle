<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="From source code to artifact in four ecosystems. Java: source built with Maven or Gradle into jar, war or ear. Node.js: built with npm into tar.gz. Python: built into whl or tar.gz. .NET: built with MSBuild into dll. Every artifact is stored in an artifact repository.">
