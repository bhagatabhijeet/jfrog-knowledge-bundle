<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Checksum-based storage. The database holds repository paths; the filestore holds each binary once, named by its SHA-1 checksum and filed in a folder named after the checksum's first two characters. Two paths for the same guava jar point to one stored file.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient>
<linearGradient id="db" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8D4"/><stop offset="1" stop-color="#7C4DFF"/></linearGradient>
<linearGradient id="fs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE14D"/><stop offset=".5" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF4FA3"/></linearGradient></defs>
<rect width="1200" height="700" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="680" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Filed by fingerprint, not by name</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Paths live in the database. Each binary lives once in the filestore, named by its checksum.</text>
<rect x="40" y="124" width="460" height="470" rx="24" fill="#FFFFFF" fill-opacity=".04" stroke="url(#db)" stroke-width="3"/>
<rect x="40" y="124" width="460" height="86" rx="24" fill="url(#db)"/><rect x="40" y="184" width="460" height="26" fill="url(#db)"/>
<text x="270" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">Database</text>
<text x="270" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#FFFFFF">WHAT YOU SEE · REPOSITORY PATHS</text>
<rect x="700" y="124" width="460" height="470" rx="24" fill="#FFFFFF" fill-opacity=".04" stroke="url(#fs)" stroke-width="3"/>
<rect x="700" y="124" width="460" height="86" rx="24" fill="url(#fs)"/><rect x="700" y="184" width="460" height="26" fill="url(#fs)"/>
