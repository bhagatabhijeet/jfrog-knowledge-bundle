<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="620" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">One server, every version</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Builds put artifacts in. Everyone else takes the exact version they need.</text>
