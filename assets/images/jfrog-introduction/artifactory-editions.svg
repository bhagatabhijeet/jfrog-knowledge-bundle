<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Two ways to get Artifactory. Open source: you run it on your own servers, you install and upgrade it, it is a free download and it manages Java binary artifacts. SaaS: JFrog runs it on AWS, Google Cloud or Azure with automated updates, by subscription, with the full JFrog Platform.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient>
<linearGradient id="oss" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00C853"/><stop offset="1" stop-color="#B2FF59"/></linearGradient>
<linearGradient id="saas" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8D4"/><stop offset="1" stop-color="#7C4DFF"/></linearGradient></defs>
<rect width="1200" height="700" rx="28" fill="url(#bg)"/>
