<text x="270" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#06210F">ARTIFACTORY OSS · SELF-HOSTED</text>
