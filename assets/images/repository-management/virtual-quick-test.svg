<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" width="1200" height="590" role="img" aria-label="The ten-second test for choosing a repository. If someone needs to download, use the virtual URL. If someone needs to upload, use the virtual URL; it lands in the default local repository. If an admin is working on one specific repository, go direct to that local or remote repository.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient></defs>
<rect width="1200" height="590" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="570" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">The 10-second test: who is asking?</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Two roads out of three lead to the virtual repository.</text>
<rect x="40" y="124" width="360" height="400" rx="24" fill="#B388FF" fill-opacity=".12" stroke="#B388FF" stroke-width="3"/><circle cx="220" cy="190" r="48" fill="#B388FF" fill-opacity=".22"/><line x1="220" y1="164" x2="220" y2="202" stroke="#B388FF" stroke-width="9" stroke-linecap="round"/><polygon points="220,220 200,196 240,196" fill="#B388FF"/><text x="220" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#B9C2FF">Someone needs to</text><text x="220" y="310" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">DOWNLOAD</text><text x="220" y="344" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D7DCFF">a developer</text><text x="220" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D7DCFF">a build tool</text><text x="220" y="392" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D7DCFF">a pipeline</text><rect x="70" y="428" width="300" height="50" rx="25" fill="#B388FF"/><text x="220" y="460" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5" fill="#1F0A4D">USE THE VIRTUAL URL</text><text x="220" y="504" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B388FF">it finds the artifact for them</text><rect x="420" y="124" width="360" height="400" rx="24" fill="#B388FF" fill-opacity=".12" stroke="#B388FF" stroke-width="3"/><circle cx="600" cy="190" r="48" fill="#B388FF" fill-opacity=".22"/><line x1="600" y1="216" x2="600" y2="178" stroke="#B388FF" stroke-width="9" stroke-linecap="round"/><polygon points="600,160 580,184 620,184" fill="#B388FF"/><text x="600" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#B9C2FF">Someone needs to</text><text x="600" y="310" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">UPLOAD</text><text x="600" y="344" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D7DCFF">publishing a build</text><text x="600" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D7DCFF">sharing a package</text><text x="600" y="392" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D7DCFF">releasing a version</text><rect x="450" y="428" width="300" height="50" rx="25" fill="#B388FF"/><text x="600" y="460" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5" fill="#1F0A4D">USE THE VIRTUAL URL</text><text x="600" y="504" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B388FF">it lands in the default local</text><rect x="800" y="124" width="360" height="400" rx="24" fill="#FFE14D" fill-opacity=".12" stroke="#FFE14D" stroke-width="3"/><circle cx="980" cy="190" r="48" fill="#FFE14D" fill-opacity=".22"/><rect x="974" y="154" width="12" height="16" rx="3" fill="#FFE14D" transform="rotate(0 980 190)"/><rect x="974" y="154" width="12" height="16" rx="3" fill="#FFE14D" transform="rotate(45 980 190)"/><rect x="974" y="154" width="12" height="16" rx="3" fill="#FFE14D" transform="rotate(90 980 190)"/><rect x="974" y="154" width="12" height="16" rx="3" fill="#FFE14D" transform="rotate(135 980 190)"/><rect x="974" y="154" width="12" height="16" rx="3" fill="#FFE14D" transform="rotate(180 980 190)"/><rect x="974" y="154" width="12" height="16" rx="3" fill="#FFE14D" transform="rotate(225 980 190)"/><rect x="974" y="154" width="12" height="16" rx="3" fill="#FFE14D" transform="rotate(270 980 190)"/><rect x="974" y="154" width="12" height="16" rx="3" fill="#FFE14D" transform="rotate(315 980 190)"/><circle cx="980" cy="190" r="24" fill="#FFE14D"/><circle cx="980" cy="190" r="10" fill="#1B1650"/><text x="980" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#B9C2FF">An admin is working on</text><text x="980" y="310" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">ONE REPOSITORY</text><text x="980" y="344" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D7DCFF">cleanup</text><text x="980" y="368" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D7DCFF">settings</text><text x="980" y="392" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#D7DCFF">replication</text><rect x="830" y="428" width="300" height="50" rx="25" fill="#FFE14D"/><text x="980" y="460" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" letter-spacing="1.5" fill="#2B1B00">GO DIRECT</text><text x="980" y="504" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFE14D">to that local or remote</text>
<text x="600" y="562" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#B9C2FF">IF IN DOUBT, USE THE VIRTUAL URL</text></svg>