<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="A remote repository. A build requests a dependency; the remote repository fetches it once from an outside source such as Maven Central, the npm registry, PyPI or another Artifactory, caches it and delivers it. Later requests are served from the cache.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient></defs>
<rect width="1200" height="500" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="480" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Remote repository: fetch once, keep a copy</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">A proxy and cache for dependencies that live somewhere else.</text>
<rect x="40" y="200" width="220" height="110" rx="18" fill="#82B1FF" fill-opacity=".16" stroke="#82B1FF" stroke-width="2.5"/><text x="150.0" y="244.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Your build</text><text x="150.0" y="270.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#BBDEFB">needs a dependency</text><line x1="270" y1="235" x2="400.0" y2="235.0" stroke="#FF8A00" stroke-width="5" stroke-linecap="round"/><polygon points="416,235 400.0,244.0 400.0,226.0" fill="#FF8A00"/><text x="343.0" y="223.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#FF8A00">1  REQUEST</text><line x1="416" y1="280" x2="286.0" y2="280.0" stroke="#FF8A00" stroke-width="5" stroke-linecap="round"/><polygon points="270,280 286.0,271.0 286.0,289.0" fill="#FF8A00"/><text x="343.0" y="306.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#FF8A00">4  DELIVER</text><rect x="422" y="140" width="340" height="250" rx="22" fill="#FF8A00" fill-opacity=".16" stroke="#FF8A00" stroke-width="3"/><rect x="422" y="140" width="340" height="66" rx="22" fill="#FF8A00"/><rect x="422" y="186" width="340" height="20" fill="#FF8A00"/><text x="592.0" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#2B1B00">Remote repository</text><text x="592.0" y="194" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#2B1B00">npmjs-remote</text><rect x="446" y="226" width="292" height="140" rx="16" fill="#FFFFFF" fill-opacity=".08" stroke="#FFE14D" stroke-width="2" stroke-dasharray="6 6"/><text x="592" y="254" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="3" fill="#FFE14D">3  CACHE</text><rect x="466" y="268" width="252" height="32" rx="16" fill="#FF8A00" fill-opacity=".55"/><text x="592" y="290" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" fill="#FFFFFF">lodash-4.17.21.tgz</text><rect x="466" y="310" width="252" height="32" rx="16" fill="#FF8A00" fill-opacity=".55"/><text x="592" y="332" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" fill="#FFFFFF">express-4.19.2.tgz</text><line x1="772" y1="235" x2="902.0" y2="235.0" stroke="#FF8A00" stroke-width="5" stroke-linecap="round"/><polygon points="918,235 902.0,244.0 902.0,226.0" fill="#FF8A00"/><text x="845.0" y="223.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#FF8A00">2  FETCH ONCE</text><line x1="918" y1="280" x2="788.0" y2="280.0" stroke="#FF8A00" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 9"/><polygon points="772,280 788.0,271.0 788.0,289.0" fill="#FF8A00"/><rect x="924" y="140" width="236" height="250" rx="22" fill="#FFFFFF" fill-opacity=".06" stroke="#B9C2FF" stroke-width="2"/><text x="1042" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#B9C2FF">THE OUTSIDE WORLD</text><rect x="944" y="192" width="196" height="36" rx="18" fill="#FFE14D"/><text x="1042" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#2B1B00">Maven Central</text><rect x="944" y="238" width="196" height="36" rx="18" fill="#FFE14D"/><text x="1042" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#2B1B00">npm registry</text><rect x="944" y="284" width="196" height="36" rx="18" fill="#FFE14D"/><text x="1042" y="308" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#2B1B00">PyPI</text><rect x="944" y="330" width="196" height="36" rx="18" fill="#FFE14D"/><text x="1042" y="354" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#2B1B00">Another Artifactory</text><text x="600" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Next time, steps 2 and 3 are skipped: the cache answers.</text><text x="600" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2" fill="#B9C2FF">FASTER BUILDS  ·  STILL WORKS IF THE PUBLIC REGISTRY IS DOWN</text></svg>