chor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="40" font-weight="900" fill="#FFE14D">-</text><rect x="610" y="140" width="250" height="96" rx="20" fill="#80D8FF" fill-opacity="0.95"/><text x="735.0" y="202" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="40" font-weight="900" fill="#00222A">dev</text><line x1="735.0" y1="240" x2="735.0" y2="286" stroke="#80D8FF" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/><rect x="610" y="290" width="250" height="84" rx="16" fill="#80D8FF" fill-opacity="0.14" stroke="#80D8FF" stroke-width="2.5"/><text x="735.0" y="322" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#80D8FF" letter-spacing="3">MATURITY</text><text x="735.0" y="352" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Which stage</text><text x="870" y="204" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="40" font-weight="900" fill="#FFE14D">-</text><rect x="880" y="140" width="250" height="96" rx="20" fill="#EA80FC" fill-opacity="0.95"/><text x="1005.0" y="202" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="40" font-weight="900" fill="#3A0A4A">local</text><line x1="1005.0" y1="240" x2="1005.0" y2="286" stroke="#EA80FC" stroke-width="3" stroke-dasharray="3 7" stroke-linecap="round"/><rect x="880" y="290" width="250" height="84" rx="16" fill="#EA80FC" fill-opacity="0.14" stroke="#EA80FC" stroke-width="2.5"/><text x="1005.0" y="322" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#EA80FC" letter-spacing="3">LOCATOR</text><text x="1005.0" y="352" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Where or what type</text><rect x="70" y="404" width="1060" height="48" rx="12" fill="#69F0AE" fill-opacity="0.1" stroke="#69F0AE" stroke-width="1.5"/><text x="92" y="435" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="900" fill="#69F0AE">Local</text><text x="260" y="435" text-anchor="start" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" font-weight="600" fill="#D7DCFF">&lt;team&gt;-&lt;tech&gt;-&lt;maturity&gt;-&lt;locator&gt;</text><text x="1110" y="435" text-anchor="end" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="16" font-weight="800" fill="#FFFFFF">payments-maven-dev-local</text><rect x="70" y="462" width="1060" height="48" rx="12" fill="#FFB74D" fill-opacity="0.1" stroke="#FFB74D" stroke-width="1.5"/><text x="92" y="493" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="900" fill="#FFB74D">Remote</text><text x="260" y="493" text-anchor="start" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" font-weight="600" fill="#D7DCFF">&lt;registry&gt;-remote</text><text x="1110" y="493" text-anchor="end" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="16" font-weight="800" fill="#FFFFFF">npmjs-remote</text><rect x="70" y="520" width="1060" height="48" rx="12" fill="#EA80FC" fill-opacity="0.1" stroke="#EA80FC" stroke-width="1.5"/><text x="92" y="551" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="900" fill="#EA80FC">Virtual</text><text x="260" y="551" text-anchor="start" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" font-weight="600" fill="#D7DCFF">&lt;team&gt;-&lt;tech&gt;-&lt;maturity&gt;</text><text x="1110" y="551" text-anchor="end" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="16" font-weight="800" fill="#FFFFFF">payments-maven-dev</text></svg>