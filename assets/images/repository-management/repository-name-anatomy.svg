<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Anatomy of a repository name: payments, maven, dev, local. The four parts are team (who owns it), tech (what kind of package), maturity (which stage) and locator (where or what type). Local repositories use all four parts, remote repositories for public registries use registry-remote, and virtual repositories drop the locator.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient></defs>
<rect width="1200" height="600" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="580" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Anatomy of a repository name</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Four parts. Read any name and you know what the repository is.</text>
