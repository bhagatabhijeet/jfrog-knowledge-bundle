<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="Before and after a virtual repository. Without one, every developer tool needs the address of each local and remote repository, and any change means everyone reconfigures. With one, tools use a single URL and the repositories behind it can change without anyone noticing.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient>
<linearGradient id="bad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF4FA3"/></linearGradient>
<linearGradient id="good" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00C853"/><stop offset="1" stop-color="#00B8D4"/></linearGradient></defs>
<rect width="1200" height="610" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="590" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Why the virtual repository matters</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Same four repositories. One small change in front of them.</text>
