<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Why package type matters. A .nupkg uploaded to a NuGet repository is read and indexed, so dotnet restore finds it. The same .nupkg uploaded to a Maven repository is only stored: no NuGet index is built, so dotnet restore cannot find the package.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient></defs>
<rect width="1200" height="580" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="560" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Same file, two very different outcomes</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">The repository's package type decides whether Artifactory understands what you upload.</text>
<rect x="40" y="124" width="1120" height="200" rx="22" fill="#69F0AE" fill-opacity=".10" stroke="#69F0AE" stroke-width="2.5"/><text x="64" y="158" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="3" fill="#69F0AE">RIGHT TYPE  ·  A NUGET REPOSITORY</text><rect x="64" y="184" width="210" height="100" rx="16" fill="#FFFFFF" fill-opacity=".08" stroke="#82B1FF" stroke-width="2.5"/><text x="169" y="228" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="19" font-weight="700" fill="#FFFFFF">MyLib.1.2.0</text><text x="169" y="256" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="19" font-weight="700" fill="#82B1FF">.nupkg</text><line x1="286" y1="234" x2="352" y2="234" stroke="#69F0AE" stroke-width="5" stroke-linecap="round"/><polygon points="366,234 350,225 350,243" fill="#69F0AE"/><text x="326" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5" fill="#69F0AE">UPLOAD</text><rect x="372" y="174" width="330" height="120" rx="18" fill="#69F0AE"/><text x="537" y="212" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#06210F">NuGet repository</text><text x="537" y="242" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#06210F">Reads the package</text><text x="537" y="266" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#06210F">Builds the NuGet index</text><line x1="714" y1="234" x2="780" y2="234" stroke="#69F0AE" stroke-width="5" stroke-linecap="round"/><polygon points="794,234 778,225 778,243" fill="#69F0AE"/><rect x="800" y="184" width="250" height="100" rx="16" fill="#0B1026" stroke="#69F0AE" stroke-width="2.5"/><text x="820" y="222" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="16" font-weight="700" fill="#FFFFFF">$ dotnet restore</text><text x="820" y="254" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" fill="#69F0AE">Restored MyLib 1.2.0</text><circle cx="1104" cy="234" r="26" fill="#00C853"/><path d="M 1092 235 L 1101 244 L 1117 225" fill="none" stroke="#06210F" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1136" y="310" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B9C2FF">Searchable and resolvable as a NuGet package</text><rect x="40" y="344" width="1120" height="200" rx="22" fill="#FF8A9B" fill-opacity=".10" stroke="#FF8A9B" stroke-width="2.5"/><text x="64" y="378" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="3" fill="#FF8A9B">WRONG TYPE  ·  A MAVEN REPOSITORY</text><rect x="64" y="404" width="210" height="100" rx="16" fill="#FFFFFF" fill-opacity=".08" stroke="#82B1FF" stroke-width="2.5"/><text x="169" y="448" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="19" font-weight="700" fill="#FFFFFF">MyLib.1.2.0</text><text x="169" y="476" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="19" font-weight="700" fill="#82B1FF">.nupkg</text><line x1="286" y1="454" x2="352" y2="454" stroke="#FF8A9B" stroke-width="5" stroke-linecap="round"/><polygon points="366,454 350,445 350,463" fill="#FF8A9B"/><text x="326" y="436" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.5" fill="#FF8A9B">UPLOAD</text><rect x="372" y="394" width="330" height="120" rx="18" fill="#FF8A9B"/><text x="537" y="432" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#2B0A1E">Maven repository</text><text x="537" y="462" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B0A1E">Stores the file</text><text x="537" y="486" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B0A1E">No NuGet index is built</text><line x1="714" y1="454" x2="780" y2="454" stroke="#FF8A9B" stroke-width="5" stroke-linecap="round"/><polygon points="794,454 778,445 778,463" fill="#FF8A9B"/><rect x="800" y="404" width="250" height="100" rx="16" fill="#0B1026" stroke="#FF8A9B" stroke-width="2.5"/><text x="820" y="442" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="16" font-weight="700" fill="#FFFFFF">$ dotnet restore</text><text x="820" y="474" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" fill="#FF8A9B">error: package not found</text><circle cx="1104" cy="454" r="26" fill="#FF4F6D"/><path d="M 1094 444 L 1114 464 M 1114 444 L 1094 464" fill="none" stroke="#2B0A1E" stroke-width="6" stroke-linecap="round"/><text x="1136" y="530" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#B9C2FF">The file is there, but .NET tools cannot see it as a package</text></svg>