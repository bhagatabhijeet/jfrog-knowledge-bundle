00">Organizational artifacts</text><circle cx="980" cy="242" r="4.5" fill="#00C853"/><text x="992" y="247" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B1B00">Internal packages</text><circle cx="980" cy="266" r="4.5" fill="#00C853"/><text x="992" y="271" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B1B00">Microservice artifacts</text><circle cx="980" cy="290" r="4.5" fill="#00C853"/><text x="992" y="295" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B1B00">Client-specific builds</text><path d="M 632 420 C 687.0 420, 687.0 520, 728 520" fill="none" stroke="#FF8A00" stroke-width="5" stroke-linecap="round"/><polygon points="742,520 726,511 726,529" fill="#FF8A00"/><text x="690" y="546" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="1.5" fill="#FF8A00">2  THEN HERE</text><ellipse cx="840" cy="590" rx="90.0" ry="22" fill="#C25E00"/><rect x="750.0" y="480" width="180" height="110" fill="#FF8A00"/><rect x="750.0" y="480" width="50.400000000000006" height="110" fill="#FFE0B2" opacity=".25"/><rect x="894.0" y="480" width="36.0" height="110" fill="#C25E00" opacity=".45"/><ellipse cx="840" cy="480" rx="90.0" ry="22" fill="#FFE0B2"/><ellipse cx="840" cy="480" rx="80.0" ry="16" fill="#FF8A00" opacity=".55"/><polygon points="820,440 839.1,451.0 820,462 800.9,451.0" fill="#EA80FC"/><polygon points="800.9,451.0 820,462 820,484 800.9,473.0" fill="#AA00FF"/><polygon points="839.1,451.0 820,462 820,484 839.1,473.0" fill="#7200CA"/><polygon points="864,442 883.1,453.0 864,464 844.9,453.0" fill="#80D8FF"/><polygon points="844.9,453.0 864,464 864,486 844.9,475.0" fill="#0091EA"/><polygon points="883.1,453.0 864,464 864,486 883.1,475.0" fill="#0064B7"/><text x="840" y="546" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#2B1B00">REMOTE</text><text x="840" y="572" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#2B1B00">PROXY + CACHE</text><text x="776" y="436" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" fill="#FFB74D" opacity=".5">2</text><g fill="#FFFFFF"><circle cx="1016" cy="476" r="30"/><circle cx="1050" cy="454" r="40"/><circle cx="1096" cy="468" r="34"/><rect x="992" y="472" width="134" height="34" rx="17"/></g><text x="1058" y="484" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="#1B1650">INTERNET</text><path d="M 936 520 C 968.0 520, 968.0 520, 986 520" fill="none" stroke="#FF8A00" stroke-width="4" stroke-linecap="round" stroke-dasharray="5 9"/><polygon points="1000,520 984,511 984,529" fill="#FF8A00"/><rect x="968" y="528" width="92" height="28" rx="14" fill="#FFE14D"/><text x="1014" y="547" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#2B1B00">Maven Central</text><rect x="1066" y="528" width="92" height="28" rx="14" fill="#FFE14D"/><text x="1112" y="547" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#2B1B00">npm registry</text><rect x="968" y="564" width="92" height="28" rx="14" fill="#FFE14D"/><text x="1014" y="583" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#2B1B00">PyPI</text><rect x="1066" y="564" width="92" height="28" rx="14" fill="#FFE14D"/><text x="1112" y="583" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#2B1B00">Artifactory</text><rect x="40" y="668" width="360" height="72" rx="18" fill="#00C853"/><text x="60" y="698" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#06210F">LOCAL</text><text x="60" y="724" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#06210F">You upload. It keeps what you build.</text><rect x="420" y="668" width="360" height="72" rx="18" fill="#FF8A00"/><text x="440" y="698" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#2B1B00">REMOTE</text><text x="440" y="724" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#2B1B00">It fetches once, then serves from cache.</text><rect x="800" y="668" width="360" height="72" rx="18" fill="#B388FF"/><text x="820" y="698" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#1F0A4D">VIRTUAL</text><text x="820" y="724" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1F0A4D">One URL in front of the other two.</text></svg>