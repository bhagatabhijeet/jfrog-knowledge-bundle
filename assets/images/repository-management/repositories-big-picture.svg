<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-label="How the three repository types work together. Developers and CI pipelines use one URL, the virtual repository. It looks first in the local repository, which holds what you build: organizational artifacts, internal packages, microservice artifacts and client-specific builds. Then it asks the remote repository, a proxy and cache that fetches from the internet: Maven Central, the npm registry, PyPI or another Artifactory.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".55" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient>
<radialGradient id="portal" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#EA80FC"/><stop offset=".55" stop-color="#7C4DFF"/><stop offset="1" stop-color="#3F1DCB"/></radialGradient>
<radialGradient id="halo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#B388FF" stop-opacity=".55"/><stop offset="1" stop-color="#B388FF" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="770" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="750" r="160" fill="#00E5FF" opacity=".08"/>
<g stroke="#FFFFFF" stroke-opacity=".05" stroke-width="1"><line x1="200" y1="110" x2="-40" y2="650"/><line x1="290" y1="110" x2="50" y2="650"/><line x1="380" y1="110" x2="140" y2="650"/><line x1="470" y1="110" x2="230" y2="650"/><line x1="560" y1="110" x2="320" y2="650"/><line x1="650" y1="110" x2="410" y2="650"/><line x1="740" y1="110" x2="500" y2="650"/><line x1="830" y1="110" x2="590" y2="650"/><line x1="920" y1="110" x2="680" y2="650"/><line x1="1010" y1="110" x2="770" y2="650"/><line x1="1100" y1="110" x2="860" y2="650"/><line x1="1190" y1="110" x2="950" y2="650"/><line x1="1280" y1="110" x2="1040" y2="650"/><line x1="1370" y1="110" x2="1130" y2="650"/><line x1="1460" y1="110" x2="1220" y2="650"/></g>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF">Three repositories, one team</text>
<text x="40" y="94" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Everyone asks the virtual repository. It knows where to look, and in what order.</text>
