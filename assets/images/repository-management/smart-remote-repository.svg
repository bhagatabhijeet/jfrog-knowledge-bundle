<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-label="A Smart Remote repository at one site proxies and caches a repository at another Artifactory site. Beyond ordinary proxying it reports download statistics to the source, and receives property changes, folder listings and a signal when the original artifact is deleted.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient></defs>
<rect width="1200" height="530" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="510" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Smart Remote: two sites that stay in touch</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">A remote repository whose upstream is another Artifactory.</text>
<rect x="40" y="130" width="380" height="330" rx="22" fill="#FFB74D" fill-opacity="0.12" stroke="#FFB74D" stroke-width="2.5"/><text x="230" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#FFB74D" letter-spacing="3">YOUR SITE</text><text x="230" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF">London</text><rect x="70" y="222" width="320" height="96" rx="14" fill="#FFB74D" fill-opacity="0.9"/><text x="230" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#2B1B00">Smart Remote repository</text><text x="230" y="286" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#2B1B00">payments-mvn-dev-london</text><rect x="70" y="336" width="320" height="100" rx="14" fill="#FFFFFF" fill-opacity="0.07"/><text x="230" y="372" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Your teams and builds</text><text x="230" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C2FF">ask here, get it fast from the cache</text><rect x="780" y="130" width="380" height="330" rx="22" fill="#69F0AE" fill-opacity="0.12" stroke="#69F0AE" stroke-width="2.5"/><text x="970" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#69F0AE" letter-spacing="3">THE OTHER SITE</text><text x="970" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="900" fill="#FFFFFF">New York</text><rect x="810" y="222" width="320" height="96" rx="14" fill="#69F0AE" fill-opacity="0.9"/><text x="970" y="258" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#06210F">The source repository</text><text x="970" y="286" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#06210F">payments-mvn-dev-local</text><rect x="810" y="336" width="320" height="100" rx="14" fill="#FFFFFF" fill-opacity="0.07"/><text x="970" y="372" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">The team that builds it</text><text x="970" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C2FF">owns and publishes the artifacts</text><line x1="432" y1="162" x2="755" y2="162" stroke="#FFB74D" stroke-width="4" stroke-linecap="round"/><polygon points="768,162 753,154 753,170" fill="#FFB74D"/><rect x="486" y="122" width="228" height="26" rx="13" fill="#0B1026" fill-opacity="1" stroke="#FFB74D" stroke-width="1.5"/><text x="600" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="900" fill="#FFB74D" letter-spacing="1.5">PROXY AND CACHE</text><line x1="432" y1="224" x2="755" y2="224" stroke="#FFB74D" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 8"/><polygon points="768,224 753,216 753,232" fill="#FFB74D"/><rect x="486" y="184" width="228" height="26" rx="13" fill="#0B1026" fill-opacity="1" stroke="#FFB74D" stroke-width="1.5"/><text x="600" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="900" fill="#FFB74D" letter-spacing="1.5">DOWNLOAD STATISTICS</text><line x1="768" y1="286" x2="445" y2="286" stroke="#69F0AE" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 8"/><polygon points="432,286 447,278 447,294" fill="#69F0AE"/><rect x="486" y="246" width="228" height="26" rx="13" fill="#0B1026" fill-opacity="1" stroke="#69F0AE" stroke-width="1.5"/><text x="600" y="264" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="900" fill="#69F0AE" letter-spacing="1.5">PROPERTY CHANGES</text><line x1="768" y1="348" x2="445" y2="348" stroke="#69F0AE" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 8"/><polygon points="432,348 447,340 447,356" fill="#69F0AE"/><rect x="486" y="308" width="228" height="26" rx="13" fill="#0B1026" fill-opacity="1" stroke="#69F0AE" stroke-width="1.5"/><text x="600" y="326" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="900" fill="#69F0AE" letter-spacing="1.5">FOLDER LISTING</text><line x1="768" y1="410" x2="445" y2="410" stroke="#69F0AE" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 8"/><polygon points="432,410 447,402 447,418" fill="#69F0AE"/><rect x="486" y="370" width="228" height="26" rx="13" fill="#0B1026" fill-opacity="1" stroke="#69F0AE" stroke-width="1.5"/><text x="600" y="388" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="900" fill="#69F0AE" letter-spacing="1.5">DELETED-AT-SOURCE</text><text x="600" y="500" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">An ordinary remote only fetches. A Smart Remote also keeps the two sites talking.</text></svg>