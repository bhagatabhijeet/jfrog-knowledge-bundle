oke-width="2.5"/><text x="1033.0" y="283.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Pipelines</text><rect x="906" y="330" width="254" height="70" rx="18" fill="#82B1FF" fill-opacity=".16" stroke="#82B1FF" stroke-width="2.5"/><text x="1033.0" y="373.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Environments</text><text x="600" y="462" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">If your organization made it, it lives in a local repository.</text></svg>