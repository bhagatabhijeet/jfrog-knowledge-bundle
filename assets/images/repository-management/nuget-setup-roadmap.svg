<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Setting up .NET repositories in four steps. One: create a local NuGet repository for your own packages. Two: create a remote NuGet repository that proxies nuget.org. Three: create a virtual NuGet repository containing the local first and then the remote, with the local as default deployment repository. Four: connect the dotnet client to the virtual URL.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient></defs>
<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="620" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Setting up .NET in four steps</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Local first, remote second, virtual third. The virtual needs the other two to exist.</text>
<path d="M 170 250 L 1030 250" stroke="#FFE14D" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/><rect x="40" y="300" width="260" height="230" rx="22" fill="#00C853" fill-opacity=".16" stroke="#00C853" stroke-width="3"/><circle cx="170" cy="250" r="48" fill="#00C853"/><circle cx="170" cy="250" r="58" fill="none" stroke="#00C853" stroke-width="3" stroke-opacity=".45"/><text x="170" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" fill="#06210F">1</text><text x="170" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">Local</text><rect x="56" y="368" width="228" height="38" rx="19" fill="#00C853"/><text x="170" y="393" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#06210F">payments-nuget-dev-local</text><text x="170" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Type: NuGet</text><text x="170" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Holds your own .nupkg files</text><polygon points="315,250 299,241 299,259" fill="#FFE14D"/><rect x="325" y="300" width="260" height="230" rx="22" fill="#FF8A00" fill-opacity=".16" stroke="#FF8A00" stroke-width="3"/><circle cx="455" cy="250" r="48" fill="#FF8A00"/><circle cx="455" cy="250" r="58" fill="none" stroke="#FF8A00" stroke-width="3" stroke-opacity=".45"/><text x="455" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" fill="#2B1B00">2</text><text x="455" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">Remote</text><rect x="341" y="368" width="228" height="38" rx="19" fill="#FF8A00"/><text x="455" y="393" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#2B1B00">nugetorg-remote</text><text x="455" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Type: NuGet</text><text x="455" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Proxies and caches nuget.org</text><polygon points="600,250 584,241 584,259" fill="#FFE14D"/><rect x="610" y="300" width="260" height="230" rx="22" fill="#B388FF" fill-opacity=".16" stroke="#B388FF" stroke-width="3"/><circle cx="740" cy="250" r="48" fill="#B388FF"/><circle cx="740" cy="250" r="58" fill="none" stroke="#B388FF" stroke-width="3" stroke-opacity=".45"/><text x="740" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" fill="#1F0A4D">3</text><text x="740" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">Virtual</text><rect x="626" y="368" width="228" height="38" rx="19" fill="#B388FF"/><text x="740" y="393" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#1F0A4D">payments-nuget-dev</text><text x="740" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Add local first, then remote</text><text x="740" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Default deploy: the local</text><polygon points="885,250 869,241 869,259" fill="#FFE14D"/><rect x="895" y="300" width="260" height="230" rx="22" fill="#82B1FF" fill-opacity=".16" stroke="#82B1FF" stroke-width="3"/><circle cx="1025" cy="250" r="48" fill="#82B1FF"/><circle cx="1025" cy="250" r="58" fill="none" stroke="#82B1FF" stroke-width="3" stroke-opacity=".45"/><text x="1025" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" fill="#001A4D">4</text><text x="1025" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">Connect</text><rect x="911" y="368" width="228" height="38" rx="19" fill="#82B1FF"/><text x="1025" y="393" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#001A4D">dotnet nuget add source</text><text x="1025" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Use the virtual URL</text><text x="1025" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Then restore and push</text><text x="170" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#69F0AE">WHAT YOU BUILD</text><text x="455" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#FFB74D">WHAT YOU DEPEND ON</text><text x="740" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#D1C4E9">ONE URL FOR BOTH</text><text x="1025" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" letter-spacing="2" fill="#BBDEFB">POINT YOUR TOOLS</text><rect x="300" y="562" width="600" height="44" rx="22" fill="#FFE14D"/><text x="600" y="590" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#2B1B00">Shortcut: Quick Repository Creation makes steps 1 to 3 in one go</text></svg>