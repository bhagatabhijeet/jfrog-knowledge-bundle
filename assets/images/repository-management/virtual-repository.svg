<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="A virtual repository. Developers and CI pipelines use one URL; the virtual repository looks in the local repository first and then the remote repository, and sends uploads to a default local repository. It stores nothing itself.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient></defs>
<rect width="1200" height="500" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="480" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Virtual repository: the front desk</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">One address in front of your local and remote repositories.</text>
<rect x="40" y="160" width="230" height="80" rx="18" fill="#82B1FF" fill-opacity=".16" stroke="#82B1FF" stroke-width="2.5"/><text x="155.0" y="189.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Developers</text><text x="155.0" y="215.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#BBDEFB">one URL in their tools</text><rect x="40" y="290" width="230" height="80" rx="18" fill="#82B1FF" fill-opacity=".16" stroke="#82B1FF" stroke-width="2.5"/><text x="155.0" y="319.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">CI pipelines</text><text x="155.0" y="345.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#BBDEFB">the same URL</text><line x1="280" y1="200" x2="411.3" y2="255.7" stroke="#B388FF" stroke-width="5" stroke-linecap="round"/><polygon points="426,262 407.8,264.0 414.8,247.5" fill="#B388FF"/><line x1="280" y1="330" x2="410.6" y2="292.4" stroke="#B388FF" stroke-width="5" stroke-linecap="round"/><polygon points="426,288 413.1,301.1 408.1,283.8" fill="#B388FF"/><rect x="432" y="180" width="270" height="190" rx="22" fill="#B388FF"/><text x="567" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="26" font-weight="900" fill="#1F0A4D">Virtual repository</text><text x="567" y="262" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" font-weight="700" fill="#1F0A4D">payments-maven-dev</text><rect x="462" y="286" width="210" height="34" rx="17" fill="#1F0A4D"/><text x="567" y="309" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2" fill="#FFFFFF">ONE URL FOR EVERYTHING</text><text x="567" y="348" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F0A4D">stores nothing itself</text><line x1="712" y1="240" x2="842.7" y2="200.6" stroke="#00C853" stroke-width="5" stroke-linecap="round"/><polygon points="858,196 845.3,209.2 840.1,192.0" fill="#00C853"/><text x="785.0" y="256.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#00C853">1  LOOK HERE FIRST</text><line x1="712" y1="310" x2="842.7" y2="351.2" stroke="#FF8A00" stroke-width="5" stroke-linecap="round"/><polygon points="858,356 840.0,359.8 845.4,342.6" fill="#FF8A00"/><text x="785.0" y="367.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#FF8A00">2  THEN HERE</text><rect x="864" y="140" width="296" height="84" rx="18" fill="#00C853" fill-opacity=".16" stroke="#00C853" stroke-width="2.5"/><text x="1012.0" y="171.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Local repository</text><text x="1012.0" y="197.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" font-weight="600" fill="#69F0AE">payments-maven-dev-local</text><rect x="864" y="318" width="296" height="84" rx="18" fill="#FF8A00" fill-opacity=".16" stroke="#FF8A00" stroke-width="2.5"/><text x="1012.0" y="349.0" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF">Remote repository</text><text x="1012.0" y="375.0" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" font-weight="600" fill="#FFB74D">mavencentral-remote</text><rect x="884" y="234" width="256" height="30" rx="15" fill="#FFE14D"/><text x="1012" y="254" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" fill="#2B1B00">UPLOADS LAND HERE BY DEFAULT</text><text x="600" y="456" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">Change what sits behind it. Nobody has to update their settings.</text></svg>