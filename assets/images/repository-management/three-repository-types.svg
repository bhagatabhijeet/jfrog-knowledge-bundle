<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="The three types of Artifactory repositories. Local repository: you upload to it; it holds your organizational artifacts, internal packages, microservice artifacts and client-specific builds. Remote repository: a proxy and cache for external dependencies from Maven Central, the npm registry, PyPI or another Artifactory instance. Virtual repository: local and remote repositories behind a single URL.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient></defs>
<rect width="1200" height="740" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="720" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">The three types of repositories</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Local holds what you build. Remote brings in what you need. Virtual puts both behind one URL.</text>
<rect x="40" y="128" width="330" height="170" rx="22" fill="#00C853"/>
<text x="340" y="200" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="#06210F" opacity=".30">1</text>
<text x="64" y="240" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" font-weight="900" fill="#06210F">Local repository</text>
<text x="64" y="270" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#06210F">YOU UPLOAD TO IT</text>
<line x1="382" y1="213" x2="410.0" y2="213.0" stroke="#00C853" stroke-width="5" stroke-linecap="round"/><polygon points="426,213 410.0,222.0 410.0,204.0" fill="#00C853"/>
<rect x="432" y="173" width="340" height="80" rx="18" fill="#00C853" fill-opacity=".18" stroke="#00C853" stroke-width="2.5"/>
<text x="602" y="208" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">Upload =</text><text x="602" y="235" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">Local repository</text>
<line x1="784" y1="213" x2="812.0" y2="213.0" stroke="#00C853" stroke-width="5" stroke-linecap="round"/><polygon points="828,213 812.0,222.0 812.0,204.0" fill="#00C853"/><rect x="834" y="136" width="326" height="154" rx="18" fill="#FFE14D"/><text x="856" y="166" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2" fill="#7A4B00">WHAT GOES IN</text><circle cx="864" cy="188" r="5" fill="#00C853"/><text x="880" y="194" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1B00">Your organizational artifacts</text><circle cx="864" cy="214" r="5" fill="#00C853"/><text x="880" y="220" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1B00">Internal packages</text><circle cx="864" cy="240" r="5" fill="#00C853"/><text x="880" y="246" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1B00">Microservice artifacts</text><circle cx="864" cy="266" r="5" fill="#00C853"/><text x="880" y="272" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1B00">Client-specific builds</text><rect x="40" y="328" width="330" height="170" rx="22" fill="#FF8A00"/>
<text x="340" y="400" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="#2B1B00" opacity=".30">2</text>
<text x="64" y="440" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" font-weight="900" fill="#2B1B00">Remote repository</text>
<text x="64" y="470" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#2B1B00">IT FETCHES FOR YOU</text>
<line x1="382" y1="413" x2="410.0" y2="413.0" stroke="#FF8A00" stroke-width="5" stroke-linecap="round"/><polygon points="426,413 410.0,422.0 410.0,404.0" fill="#FF8A00"/>
<rect x="432" y="373" width="340" height="80" rx="18" fill="#FF8A00" fill-opacity=".18" stroke="#FF8A00" stroke-width="2.5"/>
<text x="602" y="408" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">Proxy + cache for</text><text x="602" y="435" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">external dependencies</text>
<line x1="784" y1="413" x2="812.0" y2="413.0" stroke="#FF8A00" stroke-width="5" stroke-linecap="round"/><polygon points="828,413 812.0,422.0 812.0,404.0" fill="#FF8A00"/><rect x="834" y="336" width="326" height="154" rx="18" fill="#FFE14D"/><text x="856" y="366" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2" fill="#7A4B00">WHERE IT FETCHES FROM</text><circle cx="864" cy="388" r="5" fill="#FF8A00"/><text x="880" y="394" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1B00">Maven Central</text><circle cx="864" cy="414" r="5" fill="#FF8A00"/><text x="880" y="420" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1B00">npm registry</text><circle cx="864" cy="440" r="5" fill="#FF8A00"/><text x="880" y="446" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1B00">PyPI</text><circle cx="864" cy="466" r="5" fill="#FF8A00"/><text x="880" y="472" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1B00">Another Artifactory instance</text><rect x="40" y="528" width="330" height="170" rx="22" fill="#B388FF"/>
<text x="340" y="600" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="#1F0A4D" opacity=".30">3</text>
<text x="64" y="640" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="29" font-weight="900" fill="#1F0A4D">Virtual repository</text>
<text x="64" y="670" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#1F0A4D">ONE URL FOR EVERYTHING</text>
<line x1="382" y1="613" x2="410.0" y2="613.0" stroke="#B388FF" stroke-width="5" stroke-linecap="round"/><polygon points="426,613 410.0,622.0 410.0,604.0" fill="#B388FF"/>
<rect x="432" y="573" width="340" height="80" rx="18" fill="#B388FF" fill-opacity=".18" stroke="#B388FF" stroke-width="2.5"/>
<text x="602" y="608" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">Local + remote</text><text x="602" y="635" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#FFFFFF">behind one URL</text>
<line x1="784" y1="613" x2="812.0" y2="613.0" stroke="#B388FF" stroke-width="5" stroke-linecap="round"/><polygon points="828,613 812.0,622.0 812.0,604.0" fill="#B388FF"/><rect x="834" y="536" width="326" height="154" rx="18" fill="#FFE14D"/><text x="856" y="566" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="2" fill="#7A4B00">WHAT IT GIVES YOU</text><circle cx="864" cy="588" r="5" fill="#B388FF"/><text x="880" y="594" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1B00">A single URL for your tools</text><circle cx="864" cy="614" r="5" fill="#B388FF"/><text x="880" y="620" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1B00">Local first, then remote</text><circle cx="864" cy="640" r="5" fill="#B388FF"/><text x="880" y="646" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1B00">Swap what is behind it freely</text><circle cx="864" cy="666" r="5" fill="#B388FF"/><text x="880" y="672" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#2B1B00">Uploads go to a default local</text></svg>