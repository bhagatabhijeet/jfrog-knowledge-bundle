<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1026" width="1200" height="1026" role="img" aria-label="A tour of the JFrog Platform left menu. All Projects narrows the menu to one project. Get Started and Best Practices are guides. AppTrust governs releases. Artifactory holds Packages, Builds, Artifacts and Release Lifecycle. Xray scans for vulnerabilities, Curation blocks risky open source, Catalog lets you look up packages. AI/ML governs models and agents. Distribution delivers releases. Connect manages devices. Pipelines is JFrog's retired CI/CD product. Integrations and JFrog MCP connect other tools. Menus vary by plan.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient></defs>
<rect width="1200" height="1026" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="1006" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">The left menu, item by item</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Your menu shows the items your plan includes, so yours may be shorter than this.</text>
<rect x="40" y="120" width="300" height="816" rx="18" fill="#0F1535" stroke="#3D4A8F" stroke-width="2"/><rect x="54" y="134" width="272" height="36" rx="8" fill="none" stroke="#5C6BC0" stroke-width="2"/><circle cx="76" cy="152" r="6" fill="#B9C2FF"/><text x="96" y="158" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">All Projects</text><line x1="344" y1="152" x2="388" y2="152" stroke="#B9C2FF" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="134" width="766" height="36" rx="10" fill="#B9C2FF" fill-opacity=".12"/><rect x="394" y="134" width="8" height="36" rx="4" fill="#B9C2FF"/><text x="418" y="158" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Project list. Narrows the whole menu to one project.</text><circle cx="76" cy="196" r="6" fill="#B9C2FF"/><text x="96" y="202" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Get Started</text><line x1="344" y1="196" x2="388" y2="196" stroke="#B9C2FF" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="178" width="766" height="36" rx="10" fill="#B9C2FF" fill-opacity=".12"/><rect x="394" y="178" width="8" height="36" rx="4" fill="#B9C2FF"/><text x="418" y="202" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Guided first steps for a new site.</text><circle cx="76" cy="240" r="6" fill="#B9C2FF"/><text x="96" y="246" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Best Practices</text><line x1="344" y1="240" x2="388" y2="240" stroke="#B9C2FF" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="222" width="766" height="36" rx="10" fill="#B9C2FF" fill-opacity=".12"/><rect x="394" y="222" width="8" height="36" rx="4" fill="#B9C2FF"/><text x="418" y="246" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">JFrog's recommended ways of working.</text><circle cx="76" cy="284" r="6" fill="#FFE14D"/><text x="96" y="290" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">AppTrust</text><path d="M 296 289 L 296 279 L 301 284 L 305 277 L 309 284 L 314 279 L 314 289 Z" fill="#FFE14D"/><line x1="344" y1="284" x2="388" y2="284" stroke="#FFE14D" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="266" width="766" height="36" rx="10" fill="#FFE14D" fill-opacity=".12"/><rect x="394" y="266" width="8" height="36" rx="4" fill="#FFE14D"/><text x="418" y="290" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Govern releases: only verified application versions reach production.</text><circle cx="76" cy="328" r="6" fill="#69F0AE"/><text x="96" y="334" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Artifactory</text><line x1="344" y1="328" x2="388" y2="328" stroke="#69F0AE" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="310" width="766" height="36" rx="10" fill="#69F0AE" fill-opacity=".12"/><rect x="394" y="310" width="8" height="36" rx="4" fill="#69F0AE"/><text x="418" y="334" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">The heart of the platform: where binaries live.</text><text x="112" y="378" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#69F0AE">Packages</text><line x1="344" y1="372" x2="388" y2="372" stroke="#69F0AE" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="354" width="766" height="36" rx="10" fill="#69F0AE" fill-opacity=".12"/><rect x="394" y="354" width="8" height="36" rx="4" fill="#69F0AE"/><text x="418" y="378" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Every package, by name and version.</text><text x="112" y="422" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#69F0AE">Builds</text><line x1="344" y1="416" x2="388" y2="416" stroke="#69F0AE" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="398" width="766" height="36" rx="10" fill="#69F0AE" fill-opacity=".12"/><rect x="394" y="398" width="8" height="36" rx="4" fill="#69F0AE"/><text x="418" y="422" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">What each CI run produced, and from what.</text><text x="112" y="466" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#69F0AE">Artifacts</text><line x1="344" y1="460" x2="388" y2="460" stroke="#69F0AE" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="442" width="766" height="36" rx="10" fill="#69F0AE" fill-opacity=".12"/><rect x="394" y="442" width="8" height="36" rx="4" fill="#69F0AE"/><text x="418" y="466" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">The repository tree: browse every file.</text><text x="112" y="510" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#69F0AE">Release Lifecycle</text><line x1="344" y1="504" x2="388" y2="504" stroke="#69F0AE" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="486" width="766" height="36" rx="10" fill="#69F0AE" fill-opacity=".12"/><rect x="394" y="486" width="8" height="36" rx="4" fill="#69F0AE"/><text x="418" y="510" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Release Bundles on their way to production.</text><circle cx="76" cy="548" r="6" fill="#FF8A9B"/><text x="96" y="554" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Xray</text><line x1="344" y1="548" x2="388" y2="548" stroke="#FF8A9B" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="530" width="766" height="36" rx="10" fill="#FF8A9B" fill-opacity=".12"/><rect x="394" y="530" width="8" height="36" rx="4" fill="#FF8A9B"/><text x="418" y="554" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Scans what you have for vulnerabilities and license risks.</text><circle cx="76" cy="592" r="6" fill="#FF8A9B"/><text x="96" y="598" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Curation</text><path d="M 296 597 L 296 587 L 301 592 L 305 585 L 309 592 L 314 587 L 314 597 Z" fill="#FFE14D"/><line x1="344" y1="592" x2="388" y2="592" stroke="#FF8A9B" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="574" width="766" height="36" rx="10" fill="#FF8A9B" fill-opacity=".12"/><rect x="394" y="574" width="8" height="36" rx="4" fill="#FF8A9B"/><text x="418" y="598" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Blocks risky open source before it gets in.</text><circle cx="76" cy="636" r="6" fill="#FF8A9B"/><text x="96" y="642" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Catalog</text><path d="M 296 641 L 296 631 L 301 636 L 305 629 L 309 636 L 314 631 L 314 641 Z" fill="#FFE14D"/><line x1="344" y1="636" x2="388" y2="636" stroke="#FF8A9B" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="618" width="766" height="36" rx="10" fill="#FF8A9B" fill-opacity=".12"/><rect x="394" y="618" width="8" height="36" rx="4" fill="#FF8A9B"/><text x="418" y="642" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Look up any open source package and its risks.</text><circle cx="76" cy="680" r="6" fill="#69F0AE"/><text x="96" y="686" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Distribution</text><line x1="344" y1="680" x2="388" y2="680" stroke="#69F0AE" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="662" width="766" height="36" rx="10" fill="#69F0AE" fill-opacity=".12"/><rect x="394" y="662" width="8" height="36" rx="4" fill="#69F0AE"/><text x="418" y="686" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Delivers signed releases to remote sites and Edge nodes.</text><circle cx="76" cy="724" r="6" fill="#EA80FC"/><text x="96" y="730" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">AI/ML</text><path d="M 296 729 L 296 719 L 301 724 L 305 717 L 309 724 L 314 719 L 314 729 Z" fill="#FFE14D"/><line x1="344" y1="724" x2="388" y2="724" stroke="#EA80FC" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="706" width="766" height="36" rx="10" fill="#EA80FC" fill-opacity=".12"/><rect x="394" y="706" width="8" height="36" rx="4" fill="#EA80FC"/><text x="418" y="730" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Models, MCP servers and agent skills, governed.</text><circle cx="76" cy="768" r="6" fill="#80D8FF"/><text x="96" y="774" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Connect</text><path d="M 296 773 L 296 763 L 301 768 L 305 761 L 309 768 L 314 763 L 314 773 Z" fill="#FFE14D"/><line x1="344" y1="768" x2="388" y2="768" stroke="#80D8FF" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="750" width="766" height="36" rx="10" fill="#80D8FF" fill-opacity=".12"/><rect x="394" y="750" width="8" height="36" rx="4" fill="#80D8FF"/><text x="418" y="774" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Update and manage fleets of IoT and edge devices.</text><circle cx="76" cy="812" r="6" fill="#B0BEC5"/><text x="96" y="818" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Pipelines</text><line x1="344" y1="812" x2="388" y2="812" stroke="#B0BEC5" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="794" width="766" height="36" rx="10" fill="#B0BEC5" fill-opacity=".12"/><rect x="394" y="794" width="8" height="36" rx="4" fill="#B0BEC5"/><text x="418" y="818" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">JFrog's own CI/CD. Retired: end of life since May 2026.</text><circle cx="76" cy="856" r="6" fill="#FFB74D"/><text x="96" y="862" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Integrations</text><line x1="344" y1="856" x2="388" y2="856" stroke="#FFB74D" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="838" width="766" height="36" rx="10" fill="#FFB74D" fill-opacity=".12"/><rect x="394" y="838" width="8" height="36" rx="4" fill="#FFB74D"/><text x="418" y="862" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Plug JFrog into GitHub, Jenkins, Jira and more.</text><circle cx="76" cy="900" r="6" fill="#FFB74D"/><text x="96" y="906" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">JFrog MCP</text><line x1="344" y1="900" x2="388" y2="900" stroke="#FFB74D" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round"/><rect x="394" y="882" width="766" height="36" rx="10" fill="#FFB74D" fill-opacity=".12"/><rect x="394" y="882" width="8" height="36" rx="4" fill="#FFB74D"/><text x="418" y="906" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Lets AI coding assistants talk to your platform.</text><rect x="40" y="964" width="201.5" height="32" rx="16" fill="#69F0AE"/><text x="140.75" y="985" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0B1026">Store and release</text><rect x="253.5" y="964" width="97.0" height="32" rx="16" fill="#FF8A9B"/><text x="302.0" y="985" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0B1026">Secure</text><rect x="362.5" y="964" width="97.0" height="32" rx="16" fill="#FFE14D"/><text x="411.0" y="985" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0B1026">Govern</text><rect x="471.5" y="964" width="59.0" height="32" rx="16" fill="#EA80FC"/><text x="501.0" y="985" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0B1026">AI</text><rect x="542.5" y="964" width="106.5" height="32" rx="16" fill="#80D8FF"/><text x="595.75" y="985" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0B1026">Devices</text><rect x="661.0" y="964" width="163.5" height="32" rx="16" fill="#FFB74D"/><text x="742.75" y="985" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0B1026">Connect tools</text><path d="M 846.5 985 L 846.5 975 L 851.5 980 L 855.5 973 L 859.5 980 L 864.5 975 L 864.5 985 Z" fill="#FFE14D"/><text x="874.5" y="985" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFE14D">may need a higher plan</text></svg>