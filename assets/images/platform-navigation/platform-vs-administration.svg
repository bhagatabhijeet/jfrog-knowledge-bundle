<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="The two main menus of the JFrog Platform. Platform is for using what exists: repositories and artifacts, packages, builds, Release Bundles and projects; everyone uses it. Administration is for setting things up: creating repositories, creating and managing projects, security, site settings and service settings; admins use it.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE14D"/><stop offset=".5" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF4FA3"/></linearGradient><linearGradient id="plat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8D4"/><stop offset="1" stop-color="#2979FF"/></linearGradient><linearGradient id="adm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF4FA3"/></linearGradient></defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="600" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Two menus, two mindsets</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Platform is where you work. Administration is where you set work up.</text>
<rect x="40" y="124" width="540" height="460" rx="24" fill="#FFFFFF" fill-opacity=".04" stroke="url(#plat)" stroke-width="3"/><rect x="40" y="124" width="540" height="86" rx="24" fill="url(#plat)"/><rect x="40" y="184" width="540" height="26" fill="url(#plat)"/><text x="310" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">Platform</text><text x="310" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#FFFFFF">USE WHAT EXISTS</text><rect x="64" y="230" width="492" height="50" rx="12" fill="#FFFFFF" fill-opacity=".07"/><text x="84" y="253" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Repositories and artifacts</text><text x="84" y="272" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C2FF">Browse, upload and download</text><rect x="64" y="292" width="492" height="50" rx="12" fill="#FFFFFF" fill-opacity=".07"/><text x="84" y="315" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Packages</text><text x="84" y="334" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C2FF">Find a package and its versions</text><rect x="64" y="354" width="492" height="50" rx="12" fill="#FFFFFF" fill-opacity=".07"/><text x="84" y="377" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Builds</text><text x="84" y="396" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C2FF">See what each build produced</text><rect x="64" y="416" width="492" height="50" rx="12" fill="#FFFFFF" fill-opacity=".07"/><text x="84" y="439" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Release Bundles</text><text x="84" y="458" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C2FF">Follow a release on its way out</text><rect x="64" y="478" width="492" height="50" rx="12" fill="#FFFFFF" fill-opacity=".07"/><text x="84" y="501" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Projects</text><text x="84" y="520" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C2FF">Work inside your project</text><text x="310" y="566" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#FFE14D">EVERYONE: DEVELOPERS, LEADS, ADMINS</text><rect x="620" y="124" width="540" height="460" rx="24" fill="#FFFFFF" fill-opacity=".04" stroke="url(#adm)" stroke-width="3"/><rect x="620" y="124" width="540" height="86" rx="24" fill="url(#adm)"/><rect x="620" y="184" width="540" height="26" fill="url(#adm)"/><text x="890" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#2B0A1E">Administration</text><text x="890" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3" fill="#2B0A1E">SET THINGS UP</text><rect x="644" y="230" width="492" height="50" rx="12" fill="#FFFFFF" fill-opacity=".07"/><text x="664" y="253" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Repositories</text><text x="664" y="272" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C2FF">Create local, remote and virtual</text><rect x="644" y="292" width="492" height="50" rx="12" fill="#FFFFFF" fill-opacity=".07"/><text x="664" y="315" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">All Projects</text><text x="664" y="334" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C2FF">Create and manage projects</text><rect x="644" y="354" width="492" height="50" rx="12" fill="#FFFFFF" fill-opacity=".07"/><text x="664" y="377" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Security</text><text x="664" y="396" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C2FF">Users, groups, tokens, access</text><rect x="644" y="416" width="492" height="50" rx="12" fill="#FFFFFF" fill-opacity=".07"/><text x="664" y="439" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Site settings</text><text x="664" y="458" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C2FF">Configuration for this JPD</text><rect x="644" y="478" width="492" height="50" rx="12" fill="#FFFFFF" fill-opacity=".07"/><text x="664" y="501" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Service settings</text><text x="664" y="520" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#B9C2FF">How each JFrog service behaves</text><text x="890" y="566" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5" fill="#FFE14D">ADMINS: PLATFORM AND PROJECT ADMINS</text></svg>