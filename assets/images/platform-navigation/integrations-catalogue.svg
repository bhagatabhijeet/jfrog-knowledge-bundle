<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="The Integrations page, simplified. A left submenu offers Tools and Integrations and GraphQL Playground. The main area has a search box and a grid of tiles, each naming a tool such as GitHub, Docker, Maven, npm, Helm, AWS PrivateLink, SAML, OpenID Connect, Frogbot, LDAP, Jira, GitHub Actions, GitLab CI and Jenkins. A filter panel on the right narrows the grid by category - Packages, CI/CD, Cloud Native, IDE, Source Control, Security, AI/MLOps, Authentication, Evidence - and by cloud vendor.">
