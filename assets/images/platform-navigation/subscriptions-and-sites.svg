<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="How a JFrog account is organized. An organization has one or more subscriptions. Each subscription has one or more sites, also called JPDs or JFrog Platform Deployments, each with its own jfrog.io address. A site may be a Platform or an Edge node. MyJFrog at my.jfrog.com sits above all of it and manages subscriptions, billing, usage and topology.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE14D"/><stop offset=".5" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF4FA3"/></linearGradient></defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="600" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Organization, subscriptions, sites</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Three levels. The launcher is how you move between them.</text>
