<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Two front doors. MyJFrog at my.jfrog.com is for the people who run the account: subscription and billing, usage, topology, security settings and portal users. Your site at company.jfrog.io is for everyone who builds and ships: repositories, packages, builds and artifacts, projects, security scanning and site users.">
