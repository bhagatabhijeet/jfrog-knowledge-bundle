<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-label="Where each JFrog capability fits along the software journey. One: let in, with Curation and Catalog. Two: store, with Artifactory packages and artifacts. Three: record, with Builds. Four: scan, with Xray. Five: govern, with AppTrust and Release Lifecycle. Six: deliver, with Distribution. Seven: run, with Connect on devices. Integrations, JFrog MCP, AI/ML and Projects work across every step.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient></defs>
