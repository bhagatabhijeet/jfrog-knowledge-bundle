<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="The launcher drawer. Clicking the nine dots opens the Launcher. It lists your subscriptions and, for the chosen subscription, its sites. A green tick marks the site you are on. An arrow beside another site moves you there in the same tab, and you may be asked to sign in again. Only admin users have the launcher.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE14D"/><stop offset=".5" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF4FA3"/></linearGradient></defs>
<rect width="1200" height="620" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="600" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">The launcher: your map of everything</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Nine dots, one drawer, every subscription and site you can reach.</text>
<rect x="40" y="124" width="560" height="460" rx="22" fill="#0F1535" stroke="url(#hot)" stroke-width="3"/><circle cx="68" cy="152" r="3.6" fill="#FFE14D"/><circle cx="68" cy="163" r="3.6" fill="#FFE14D"/><circle cx="68" cy="174" r="3.6" fill="#FFE14D"/><circle cx="79" cy="152" r="3.6" fill="#FFE14D"/><circle cx="79" cy="163" r="3.6" fill="#FFE14D"/><circle cx="79" cy="174" r="3.6" fill="#FFE14D"/><circle cx="90" cy="152" r="3.6" fill="#FFE14D"/><circle cx="90" cy="163" r="3.6" fill="#FFE14D"/><circle cx="90" cy="174" r="3.6" fill="#FFE14D"/><text x="116" y="170" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF">Launcher</text><text x="68" y="216" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="2.5" fill="#8C97D6">SUBSCRIPTIONS</text><rect x="64" y="230" width="210" height="50" rx="12" fill="#FF8A3D"/><text x="82" y="261" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#2B1B00">Production</text><rect x="64" y="290" width="210" height="50" rx="12" fill="#FFFFFF" fill-opacity=".07"/><text x="82" y="321" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Sandbox</text><rect x="296" y="200" width="2" height="350" fill="#3D4A8F"/><text x="320" y="216" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="2.5" fill="#8C97D6">SITES</text><rect x="316" y="230" width="260" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.13"/><circle cx="340" cy="255" r="11" fill="#00C853"/><path d="M 334 255 L 338 260 L 346 250" fill="none" stroke="#06210F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="362" y="261" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">acme-prod</text><rect x="316" y="292" width="260" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.07"/><circle cx="340" cy="317" r="11" fill="none" stroke="#5C6BC0" stroke-width="2"/><text x="362" y="323" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">acme-dev</text><circle cx="550" cy="317" r="14" fill="#2979FF"/><path d="M 544 317 L 555 317 M 551 312 L 556 317 L 551 322" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="316" y="354" width="260" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.07"/><circle cx="340" cy="379" r="11" fill="none" stroke="#5C6BC0" stroke-width="2"/><text x="362" y="385" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">acme-edge</text><circle cx="550" cy="379" r="14" fill="#2979FF"/><path d="M 544 379 L 555 379 M 551 374 L 556 379 L 551 384" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="316" y="416" width="260" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.07"/><circle cx="340" cy="441" r="11" fill="none" stroke="#5C6BC0" stroke-width="2"/><text x="362" y="447" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">MyJFrog</text><circle cx="550" cy="441" r="14" fill="#2979FF"/><path d="M 544 441 L 555 441 M 551 436 L 556 441 L 551 446" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="640" y="130" width="520" height="98" rx="18" fill="#FFE14D" fill-opacity=".12" stroke="#FFE14D" stroke-width="2.5"/><circle cx="684" cy="179" r="17" fill="#FFE14D"/><text x="684" y="186" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#0B1026">1</text><text x="722" y="172" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">Click the nine dots</text><text x="722" y="198" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#D7DCFF">The Launcher drawer slides open. Only admin users have it.</text><rect x="640" y="244" width="520" height="98" rx="18" fill="#FF8A3D" fill-opacity=".12" stroke="#FF8A3D" stroke-width="2.5"/><circle cx="684" cy="293" r="17" fill="#FF8A3D"/><text x="684" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#0B1026">2</text><text x="722" y="286" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">Pick a subscription</text><text x="722" y="312" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#D7DCFF">If your organization has more than one, choose which to look at.</text><rect x="640" y="358" width="520" height="98" rx="18" fill="#00C853" fill-opacity=".12" stroke="#00C853" stroke-width="2.5"/><circle cx="684" cy="407" r="17" fill="#00C853"/><text x="684" y="414" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#0B1026">3</text><text x="722" y="400" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">Green tick = you are here</text><text x="722" y="426" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#D7DCFF">It marks the site you opened the Launcher from.</text><rect x="640" y="472" width="520" height="98" rx="18" fill="#82B1FF" fill-opacity=".12" stroke="#82B1FF" stroke-width="2.5"/><circle cx="684" cy="521" r="17" fill="#82B1FF"/><text x="684" y="528" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#0B1026">4</text><text x="722" y="514" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">Arrow = go there</text><text x="722" y="540" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#D7DCFF">The site opens in the same tab. You may be asked to sign in again.</text></svg>