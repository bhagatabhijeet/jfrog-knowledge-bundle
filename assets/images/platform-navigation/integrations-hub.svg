<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="JFrog Platform at the centre of a toolchain, connected to eight groups of tools: source control such as GitHub, GitLab and Bitbucket; CI/CD such as Jenkins, GitHub Actions and Azure DevOps; package managers such as Maven, npm, Docker and Helm; sign-in through SAML, LDAP and OpenID Connect; private networking on AWS, Azure and Google Cloud; security in your code with Frogbot; evidence from GitHub and GitLab attestations; and AI assistants through the JFrog MCP Server.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient>
<radialGradient id="hub" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#B9F6CA"/><stop offset=".6" stop-color="#00C853"/><stop offset="1" stop-color="#00796B"/></radialGradient></defs>
<rect width="1200" height="660" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="640" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">JFrog sits in the middle of your tools</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Integrations are the connections that make it one workflow.</text>
