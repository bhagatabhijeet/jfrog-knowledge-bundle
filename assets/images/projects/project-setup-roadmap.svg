<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 626" width="1200" height="626" role="img" aria-label="Setting up a JFrog Project in four steps. One: create it with a name and project key; only a Platform Admin can. Two: staff it with Project Admins, members and roles. Three: equip it with repositories and builds, created new or assigned. Four: run it by watching the storage quota and sharing repositories other projects need. JFrog recommends one team equals one project.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient>
<linearGradient id="proj" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8D4"/><stop offset="1" stop-color="#2979FF"/></linearGradient></defs>
<rect width="1200" height="626" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="606" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Standing up a project in four moves</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Create it, staff it, equip it, then keep it healthy.</text>
<path d="M 170 250 L 1030 250" stroke="#FFE14D" stroke-width="5" stroke-dasharray="2 14" stroke-linecap="round"/><rect x="40" y="300" width="260" height="220" rx="22" fill="#00B8D4" fill-opacity=".16" stroke="#00B8D4" stroke-width="3"/><circle cx="170" cy="250" r="48" fill="#00B8D4"/><circle cx="170" cy="250" r="58" fill="none" stroke="#00B8D4" stroke-width="3" stroke-opacity=".45"/><text x="170" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" fill="#00222A">1</text><text x="170" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">Create</text><rect x="56" y="368" width="228" height="38" rx="19" fill="#00B8D4"/><text x="170" y="393" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#00222A">Name + project key</text><text x="170" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Platform Admin only</text><text x="170" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Key becomes a prefix</text><polygon points="315,250 299,241 299,259" fill="#FFE14D"/><rect x="325" y="300" width="260" height="220" rx="22" fill="#69F0AE" fill-opacity=".16" stroke="#69F0AE" stroke-width="3"/><circle cx="455" cy="250" r="48" fill="#69F0AE"/><circle cx="455" cy="250" r="58" fill="none" stroke="#69F0AE" stroke-width="3" stroke-opacity=".45"/><text x="455" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" fill="#06210F">2</text><text x="455" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">Staff it</text><rect x="341" y="368" width="228" height="38" rx="19" fill="#69F0AE"/><text x="455" y="393" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#06210F">Members + roles</text><text x="455" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Pick Project Admins</text><text x="455" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Add users and groups</text><polygon points="600,250 584,241 584,259" fill="#FFE14D"/><rect x="610" y="300" width="260" height="220" rx="22" fill="#FFB74D" fill-opacity=".16" stroke="#FFB74D" stroke-width="3"/><circle cx="740" cy="250" r="48" fill="#FFB74D"/><circle cx="740" cy="250" r="58" fill="none" stroke="#FFB74D" stroke-width="3" stroke-opacity=".45"/><text x="740" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" fill="#2B1B00">3</text><text x="740" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">Equip it</text><rect x="626" y="368" width="228" height="38" rx="19" fill="#FFB74D"/><text x="740" y="393" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#2B1B00">Repositories + builds</text><text x="740" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Create new or assign</text><text x="740" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Local, remote, virtual</text><polygon points="885,250 869,241 869,259" fill="#FFE14D"/><rect x="895" y="300" width="260" height="220" rx="22" fill="#EA80FC" fill-opacity=".16" stroke="#EA80FC" stroke-width="3"/><circle cx="1025" cy="250" r="48" fill="#EA80FC"/><circle cx="1025" cy="250" r="58" fill="none" stroke="#EA80FC" stroke-width="3" stroke-opacity=".45"/><text x="1025" y="268" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="50" font-weight="900" fill="#3A0A4A">4</text><text x="1025" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF">Run it</text><rect x="911" y="368" width="228" height="38" rx="19" fill="#EA80FC"/><text x="1025" y="393" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" fill="#3A0A4A">Quota + sharing</text><text x="1025" y="442" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Watch storage</text><text x="1025" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Share what others need</text><rect x="330" y="548" width="540" height="44" rx="22" fill="#FFE14D"/><text x="600" y="576" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#2B1B00">JFrog recommends: one team = one project</text></svg>