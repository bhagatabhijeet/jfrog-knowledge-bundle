<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="The three levels of roles in JFrog Projects. The Platform Admin runs the whole platform: creates projects, sets storage quotas, defines global roles and shares repositories across projects. The Project Admin runs one project: manages members, creates its repositories, defines project roles and chooses what Xray indexes. Project members work inside the project with roles such as Developer, Contributor, Viewer, Release Manager and Security Manager, scoped per environment.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient>
<linearGradient id="proj" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8D4"/><stop offset="1" stop-color="#2979FF"/></linearGradient></defs>
<rect width="1200" height="640" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="620" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Who can do what in a project</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Three levels of responsibility, each narrower than the one above.</text>
<rect x="60.0" y="128" width="1080" height="136" rx="22" fill="#FFE14D" fill-opacity=".14" stroke="#FFE14D" stroke-width="3"/><rect x="60.0" y="128" width="280" height="136" rx="22" fill="#FFE14D"/><circle cx="112.0" cy="171.5" r="15.0" fill="#2B1B00"/><path d="M 88.25 224.0 Q 88.25 191.5 112.0 191.5 Q 135.75 191.5 135.75 224.0 Z" fill="#2B1B00"/><text x="152.0" y="184" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#2B1B00">PLATFORM ADMIN</text><text x="152.0" y="210" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2B1B00">Runs the whole platform</text><text x="152.0" y="238" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1.5" fill="#2B1B00">THE WHOLE PLATFORM</text><circle cx="372.0" cy="178" r="5" fill="#FFE14D"/><text x="386.0" y="184" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Creates projects</text><circle cx="762.0" cy="178" r="5" fill="#FFE14D"/><text x="776.0" y="184" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Sets storage quotas</text><circle cx="372.0" cy="224" r="5" fill="#FFE14D"/><text x="386.0" y="230" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Defines global roles</text><circle cx="762.0" cy="224" r="5" fill="#FFE14D"/><text x="776.0" y="230" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Shares repositories across projects</text><polygon points="600,282 584,266 616,266" fill="#00B8D4"/><rect x="100.0" y="284" width="1000" height="136" rx="22" fill="#00B8D4" fill-opacity=".14" stroke="#00B8D4" stroke-width="3"/><rect x="100.0" y="284" width="280" height="136" rx="22" fill="#00B8D4"/><circle cx="152.0" cy="327.5" r="15.0" fill="#00222A"/><path d="M 128.25 380.0 Q 128.25 347.5 152.0 347.5 Q 175.75 347.5 175.75 380.0 Z" fill="#00222A"/><text x="192.0" y="340" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#00222A">PROJECT ADMIN</text><text x="192.0" y="366" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#00222A">Runs one project</text><text x="192.0" y="394" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1.5" fill="#00222A">ONE PROJECT</text><circle cx="412.0" cy="334" r="5" fill="#00B8D4"/><text x="426.0" y="340" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Adds and removes members</text><circle cx="762.0" cy="334" r="5" fill="#00B8D4"/><text x="776.0" y="340" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Creates the project's repositories</text><circle cx="412.0" cy="380" r="5" fill="#00B8D4"/><text x="426.0" y="386" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Defines project roles</text><circle cx="762.0" cy="380" r="5" fill="#00B8D4"/><text x="776.0" y="386" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Chooses what Xray indexes</text><polygon points="600,438 584,422 616,422" fill="#69F0AE"/><rect x="140.0" y="440" width="920" height="136" rx="22" fill="#69F0AE" fill-opacity=".14" stroke="#69F0AE" stroke-width="3"/><rect x="140.0" y="440" width="280" height="136" rx="22" fill="#69F0AE"/><circle cx="192.0" cy="483.5" r="15.0" fill="#06210F"/><path d="M 168.25 536.0 Q 168.25 503.5 192.0 503.5 Q 215.75 503.5 215.75 536.0 Z" fill="#06210F"/><text x="232.0" y="496" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#06210F">PROJECT MEMBERS</text><text x="232.0" y="522" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#06210F">Work inside the project</text><text x="232.0" y="550" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1.5" fill="#06210F">WHAT THEIR ROLE ALLOWS</text><circle cx="452.0" cy="490" r="5" fill="#69F0AE"/><text x="466.0" y="496" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Developer, Contributor, Viewer</text><circle cx="762.0" cy="490" r="5" fill="#69F0AE"/><text x="776.0" y="496" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Release and Security Manager</text><circle cx="452.0" cy="536" r="5" fill="#69F0AE"/><text x="466.0" y="542" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Custom project roles</text><circle cx="762.0" cy="536" r="5" fill="#69F0AE"/><text x="776.0" y="542" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Scoped per environment</text><text x="600" y="610" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="2" fill="#B9C2FF">EACH LEVEL DELEGATES TO THE NEXT, SO NO ONE PERSON IS THE BOTTLENECK</text></svg>