<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" width="1200" height="610" role="img" aria-label="What a project contains. Project Payments, with key pay, has a DEV environment and a PROD environment, each with repositories whose names start with the key. It also has an automatically created build-info repository and a storage quota. Separately, it uses repositories shared from other projects, which it does not own.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient></defs>
<rect width="1200" height="610" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="590" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">What a project owns, and what it borrows</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Repositories by environment, a build-info repository, a quota, and shared repositories.</text>
<rect x="40" y="124" width="720" height="456" rx="24" fill="#FFFFFF" fill-opacity="0.04" stroke="#80D8FF" stroke-width="3"/><rect x="40" y="124" width="720" height="62" rx="24" fill="#80D8FF"/><rect x="40" y="166" width="720" height="20" fill="#80D8FF"/><text x="68" y="164" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="900" fill="#00222A">Project: Payments</text><rect x="590" y="138" width="150" height="34" rx="17" fill="#00222A" fill-opacity="1"/><text x="665" y="161" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" font-weight="800" fill="#80D8FF">key: pay</text><rect x="64" y="206" width="324" height="220" rx="18" fill="#69F0AE" fill-opacity="0.12" stroke="#69F0AE" stroke-width="2.5"/><text x="84" y="238" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#69F0AE" letter-spacing="3">DEV</text><text x="368" y="238" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#D7DCFF">developers write</text><rect x="80" y="256" width="292" height="42" rx="14" fill="#FFFFFF" fill-opacity="0.07"/><ellipse cx="104" cy="270" rx="10" ry="4" fill="#69F0AE"/><rect x="94" y="270" width="20" height="12" fill="#69F0AE"/><ellipse cx="104" cy="282" rx="10" ry="4" fill="#69F0AE" opacity=".6"/><text x="126" y="283" text-anchor="start" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#FFFFFF">pay-nuget-dev-local</text><rect x="80" y="308" width="292" height="42" rx="14" fill="#FFFFFF" fill-opacity="0.07"/><ellipse cx="104" cy="322" rx="10" ry="4" fill="#69F0AE"/><rect x="94" y="322" width="20" height="12" fill="#69F0AE"/><ellipse cx="104" cy="334" rx="10" ry="4" fill="#69F0AE" opacity=".6"/><text x="126" y="335" text-anchor="start" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#FFFFFF">pay-nuget-dev</text><text x="226" y="392" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#69F0AE">every name starts with the key</text><rect x="412" y="206" width="324" height="220" rx="18" fill="#FFB74D" fill-opacity="0.12" stroke="#FFB74D" stroke-width="2.5"/><text x="432" y="238" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#FFB74D" letter-spacing="3">PROD</text><text x="716" y="238" text-anchor="end" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#D7DCFF">release managers write</text><rect x="428" y="256" width="292" height="42" rx="14" fill="#FFFFFF" fill-opacity="0.07"/><ellipse cx="452" cy="270" rx="10" ry="4" fill="#FFB74D"/><rect x="442" y="270" width="20" height="12" fill="#FFB74D"/><ellipse cx="452" cy="282" rx="10" ry="4" fill="#FFB74D" opacity=".6"/><text x="474" y="283" text-anchor="start" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#FFFFFF">pay-nuget-prod-local</text><rect x="428" y="308" width="292" height="42" rx="14" fill="#FFFFFF" fill-opacity="0.07"/><ellipse cx="452" cy="322" rx="10" ry="4" fill="#FFB74D"/><rect x="442" y="322" width="20" height="12" fill="#FFB74D"/><ellipse cx="452" cy="334" rx="10" ry="4" fill="#FFB74D" opacity=".6"/><text x="474" y="335" text-anchor="start" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="14" font-weight="700" fill="#FFFFFF">pay-nuget-prod</text><text x="574" y="392" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFB74D">every name starts with the key</text><rect x="64" y="444" width="324" height="116" rx="18" fill="#EA80FC" fill-opacity="0.12" stroke="#EA80FC" stroke-width="2.5"/><text x="84" y="474" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#EA80FC" letter-spacing="3">BUILD-INFO</text><text x="84" y="504" text-anchor="start" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" font-weight="700" fill="#FFFFFF">pay-build-info</text><text x="84" y="530" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#D7DCFF">created automatically</text><rect x="412" y="444" width="324" height="116" rx="18" fill="#82B1FF" fill-opacity="0.12" stroke="#82B1FF" stroke-width="2.5"/><text x="432" y="474" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#82B1FF" letter-spacing="3">STORAGE QUOTA</text><rect x="432" y="492" width="284" height="18" rx="9" fill="#FFFFFF" fill-opacity=".12"/><rect x="432" y="492" width="176" height="18" rx="9" fill="#00C853"/><text x="432" y="538" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#D7DCFF">a signal, not a wall, on SaaS</text><rect x="820" y="124" width="340" height="456" rx="24" fill="#FFE14D" fill-opacity="0.08" stroke="#FFE14D" stroke-width="2.5"/><text x="990" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#FFE14D" letter-spacing="3">SHARED WITH US</text><text x="990" y="190" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#D7DCFF">owned by another project</text><rect x="848" y="212" width="284" height="64" rx="14" fill="#FFE14D" fill-opacity="0.9"/><text x="990" y="240" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" font-weight="800" fill="#2B1B00">base-images-docker</text><text x="990" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B1B00">from project: platform</text><rect x="848" y="292" width="284" height="64" rx="14" fill="#FFE14D" fill-opacity="0.9"/><text x="990" y="320" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="15" font-weight="800" fill="#2B1B00">shared-sdk-nuget</text><text x="990" y="342" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2B1B00">from project: core</text><text x="990" y="400" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">We use them.</text><text x="990" y="426" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">We do not own them.</text><text x="990" y="470" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#D7DCFF">One team maintains each;</text><text x="990" y="490" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#D7DCFF">nobody keeps a copy.</text><line x1="820" y1="244" x2="785" y2="244" stroke="#FFE14D" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 8"/><polygon points="772,244 787,236 787,252" fill="#FFE14D"/></svg>