t-size="14" fill="#FFE0B2">pay-nuget-dev-local ...</text><rect x="438" y="402" width="114" height="28" rx="14" fill="#FFB74D"/><text x="495" y="421" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#2B1B00">Repositories</text><rect x="560" y="402" width="114" height="28" rx="14" fill="#FFB74D"/><text x="617" y="421" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#2B1B00">Builds</text><rect x="682" y="402" width="114" height="28" rx="14" fill="#FFB74D"/><text x="739" y="421" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#2B1B00">Release Bundles</text><rect x="842" y="222" width="294" height="220" rx="18" fill="#EA80FC" fill-opacity=".14" stroke="#EA80FC" stroke-width="2.5"/><text x="862" y="254" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="3" fill="#EA80FC">ENVIRONMENTS</text><rect x="862" y="272" width="254" height="62" rx="14" fill="#EA80FC" fill-opacity=".30"/><text x="882" y="300" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">DEV</text><text x="882" y="322" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F3E5FF">developers can write</text><rect x="862" y="346" width="254" height="62" rx="14" fill="#EA80FC" fill-opacity=".30"/><text x="882" y="374" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">PROD</text><text x="882" y="396" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#F3E5FF">only release managers can</text><text x="862" y="430" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#EA80FC">roles apply per environment</text><rect x="64" y="462" width="1072" height="112" rx="18" fill="#82B1FF" fill-opacity=".14" stroke="#82B1FF" stroke-width="2.5"/><text x="84" y="494" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="3" fill="#82B1FF">STORAGE QUOTA</text><rect x="84" y="512" width="760" height="26" rx="13" fill="#FFFFFF" fill-opacity=".12"/><rect x="84" y="512" width="470" height="26" rx="13" fill="#00C853"/><rect x="654" y="506" width="4" height="38" fill="#FFAB00"/><rect x="806" y="506" width="4" height="38" fill="#FF4F6D"/><text x="656" y="562" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FFAB00">75% warning</text><text x="808" y="562" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#FF8A9B">95%</text><text x="870" y="524" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">62 GB of 100 GB used</text><text x="870" y="548" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#BBDEFB">set by the Platform Admin</text></svg>