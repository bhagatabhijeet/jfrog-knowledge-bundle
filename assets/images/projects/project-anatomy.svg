<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Anatomy of a JFrog Project. A project has a name and a unique project key. It contains members, who are users and groups each with a role; resources such as repositories, builds and Release Bundles; environments such as DEV and PROD, where roles apply per environment; and a storage quota set by the Platform Admin.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient>
<linearGradient id="proj" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8D4"/><stop offset="1" stop-color="#2979FF"/></linearGradient></defs>
<rect width="1200" height="630" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="610" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Inside a JFrog Project</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">One team's people, repositories and rules, gathered in a single workspace.</text>
<rect x="40" y="124" width="1120" height="470" rx="26" fill="#FFFFFF" fill-opacity=".04" stroke="url(#proj)" stroke-width="4"/><rect x="40" y="124" width="1120" height="74" rx="26" fill="url(#proj)"/><rect x="40" y="172" width="1120" height="26" fill="url(#proj)"/><text x="70" y="170" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">Project: Payments Team</text><rect x="920" y="142" width="214" height="40" rx="20" fill="#FFE14D"/><text x="1027" y="168" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="16" font-weight="700" fill="#2B1B00">project key: pay</text><rect x="64" y="222" width="330" height="220" rx="18" fill="#69F0AE" fill-opacity=".14" stroke="#69F0AE" stroke-width="2.5"/><text x="84" y="254" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" letter-spacing="3" fill="#69F0AE">MEMBERS</text><circle cx="110" cy="282" r="12" fill="#69F0AE"/><path d="M 91 324 Q 91 298 110 298 Q 129 298 129 324 Z" fill="#69F0AE"/><circle cx="160" cy="282" r="12" fill="#82B1FF"/><path d="M 141 324 Q 141 298 160 298 Q 179 298 179 324 Z" fill="#82B1FF"/><circle cx="210" cy="282" r="12" fill="#FFB74D"/><path d="M 191 324 Q 191 298 210 298 Q 229 298 229 324 Z" fill="#FFB74D"/><circle cx="260" cy="282" r="12" fill="#EA80FC"/><path d="M 241 324 Q 241 298 260 298 Q 279 298 279 324 Z" fill="#EA80FC"/><text x="84" y="358" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF">Users and groups</text><text x="84" y="384" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#B9F6CA">each with a role:</text><rect x="84" y="398" width="92" height="28" rx="14" fill="#69F0AE"/><text x="130" y="417" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" font-