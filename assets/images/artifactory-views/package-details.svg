, Arial, sans-serif" font-size="17" font-weight="900" fill="#0B1026">5</text><text x="848" y="471" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">Install command</text><text x="848" y="492" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#D7DCFF">Ready to copy, for the chosen client and repository.</text><rect x="790" y="522" width="370" height="68" rx="14" fill="#FFB74D" fill-opacity="0.12" stroke="#FFB74D" stroke-width="2"/><circle cx="822" cy="556" r="15" fill="#FFB74D"/><text x="822" y="562" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="900" fill="#0B1026">6</text><text x="848" y="551" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF">Information tabs</text><text x="848" y="572" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#D7DCFF">Readme, repositories, builds, Release Bundles, Xray data.</text></svg>