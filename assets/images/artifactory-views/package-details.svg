<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The Package Details screen, simplified. It shows the package name and type, a quick version selector, an All Versions link, details of the selected version such as published date, downloads, vulnerabilities and licenses, a client selector, an install command ready to copy, and information tabs: Info, Readme, Repositories, Builds, Release Bundles, Evidence and Xray Data.">
