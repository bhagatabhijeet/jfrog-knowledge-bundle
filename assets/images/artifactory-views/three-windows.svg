tica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Inspect one file</text><rect x="830" y="404" width="300" height="36" rx="12" fill="#FFFFFF" fill-opacity="0.07"/><circle cx="852" cy="422" r="5" fill="#69F0AE"/><text x="868" y="428" text-anchor="start" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Upload or download</text><rect x="820" y="462" width="320" height="44" rx="12" fill="#69F0AE" fill-opacity="0.9"/><text x="980" y="490" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="13" font-weight="700" fill="#06210F">npm-local/express/-/express-4.19.2.tgz</text><text x="600" y="560" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">The same software, seen through three windows.</text><text x="600" y="588" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#B9C2FF" letter-spacing="1.5">A PACKAGE IS MADE OF ARTIFACTS  ·  A BUILD RECORDS WHICH ARTIFACTS IT MADE</text></svg>