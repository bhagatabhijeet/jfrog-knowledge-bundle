<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Packages, Builds and Artifacts compared. Packages is a catalog by name and version and answers what do we have. Builds is a logbook of every CI run and answers who made it. Artifacts is a file explorer of every repository and answers where is the file. They are three windows onto the same software.">
