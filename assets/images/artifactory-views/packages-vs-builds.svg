<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 738" width="1200" height="738" role="img" aria-label="Packages versus Builds. In Packages a row is one package, identified by name and version; it appears when a package is stored, includes your own and third-party packages, tells you what exists and how to get it, and is like a shop catalog. In Builds a row is one build job, identified by name and number; it appears only when your CI publishes build-info, includes only what your CI ran, tells you how something was made and from what, and is like a factory logbook.">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1026"/><stop offset=".6" stop-color="#1B1650"/><stop offset="1" stop-color="#3A1C8F"/></linearGradient>
<linearGradient id="pk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF8A00"/><stop offset="1" stop-color="#FFD54F"/></linearGradient>
<linearGradient id="bl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8D4"/><stop offset="1" stop-color="#82B1FF"/></linearGradient></defs>
<rect width="1200" height="738" rx="28" fill="url(#bg)"/>
<circle cx="1110" cy="30" r="170" fill="#7C4DFF" opacity=".18"/><circle cx="60" cy="718" r="160" fill="#00E5FF" opacity=".08"/>
<text x="40" y="62" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF">Packages or Builds?</text>
<text x="40" y="92" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#B9C2FF">Two menu items, two completely different questions.</text>
<rect x="40" y="124" width="460" height="544" rx="24" fill="#FFFFFF" fill-opacity=".04" stroke="url(#pk)" stroke-width="3"/><rect x="40" y="124" width="460" height="86" rx="24" fill="url(#pk)"/><rect x="40" y="184" width="460" height="26" fill="url(#pk)"/><text x="270" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="900" fill="#2B1B00">Packages</text><text x="270" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#2B1B00" letter-spacing="4">THE WHAT</text><rect x="700" y="124" width="460" height="544" rx="24" fill="#FFFFFF" fill-opacity=".04" stroke="url(#bl)" stroke-width="3"/><rect x="700" y="124" width="460" height="86" rx="24" fill="url(#bl)"/><rect x="700" y="184" width="460" height="26" fill="url(#bl)"/><text x="930" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="900" fill="#00222A">Builds</text><text x="930" y="194" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" font-weight="900" fill="#00222A" letter-spacing="4">THE HOW</text><rect x="64" y="228" width="412" height="56" rx="14" fill="#FFB74D" fill-opacity="0.16" stroke="#FFB74D" stroke-width="2"/><text x="270" y="263" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">One package</text><rect x="500" y="236" width="200" height="40" rx="20" fill="#FFE14D"/><text x="600" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#2B1B00" letter-spacing="2">A ROW IS</text><rect x="724" y="228" width="412" height="56" rx="14" fill="#80D8FF" fill-opacity="0.16" stroke="#80D8FF" stroke-width="2"/><text x="930" y="263" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">One build job</text><rect x="64" y="300" width="412" height="56" rx="14" fill="#FFB74D" fill-opacity="0.16" stroke="#FFB74D" stroke-width="2"/><text x="270" y="335" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Name + version</text><rect x="500" y="308" width="200" height="40" rx="20" fill="#FFE14D"/><text x="600" y="334" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#2B1B00" letter-spacing="2">IDENTIFIED BY</text><rect x="724" y="300" width="412" height="56" rx="14" fill="#80D8FF" fill-opacity="0.16" stroke="#80D8FF" stroke-width="2"/><text x="930" y="335" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Name + number</text><rect x="64" y="372" width="412" height="56" rx="14" fill="#FFB74D" fill-opacity="0.16" stroke="#FFB74D" stroke-width="2"/><text x="270" y="407" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">A package is stored</text><rect x="500" y="380" width="200" height="40" rx="20" fill="#FFE14D"/><text x="600" y="406" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#2B1B00" letter-spacing="2">APPEARS WHEN</text><rect x="724" y="372" width="412" height="56" rx="14" fill="#80D8FF" fill-opacity="0.16" stroke="#80D8FF" stroke-width="2"/><text x="930" y="407" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Your CI publishes build-info</text><rect x="64" y="444" width="412" height="56" rx="14" fill="#FFB74D" fill-opacity="0.16" stroke="#FFB74D" stroke-width="2"/><text x="270" y="479" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Yours and third-party</text><rect x="500" y="452" width="200" height="40" rx="20" fill="#FFE14D"/><text x="600" y="478" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#2B1B00" letter-spacing="2">INCLUDES</text><rect x="724" y="444" width="412" height="56" rx="14" fill="#80D8FF" fill-opacity="0.16" stroke="#80D8FF" stroke-width="2"/><text x="930" y="479" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">Only what your CI ran</text><rect x="64" y="516" width="412" height="56" rx="14" fill="#FFB74D" fill-opacity="0.16" stroke="#FFB74D" stroke-width="2"/><text x="270" y="551" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">What exists and how to get it</text><rect x="500" y="524" width="200" height="40" rx="20" fill="#FFE14D"/><text x="600" y="550" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#2B1B00" letter-spacing="2">TELLS YOU</text><rect x="724" y="516" width="412" height="56" rx="14" fill="#80D8FF" fill-opacity="0.16" stroke="#80D8FF" stroke-width="2"/><text x="930" y="551" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">How it was made, and from what</text><rect x="64" y="588" width="412" height="56" rx="14" fill="#FFB74D" fill-opacity="0.16" stroke="#FFB74D" stroke-width="2"/><text x="270" y="623" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">A shop catalog</text><rect x="500" y="596" width="200" height="40" rx="20" fill="#FFE14D"/><text x="600" y="622" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="900" fill="#2B1B00" letter-spacing="2">THINK OF IT AS</text><rect x="724" y="588" width="412" height="56" rx="14" fill="#80D8FF" fill-opacity="0.16" stroke="#80D8FF" stroke-width="2"/><text x="930" y="623" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">A factory logbook</text><text x="600" y="710" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#B9C2FF" letter-spacing="1.5">SAME SOFTWARE. PACKAGES LOOKS AT THE RESULT. BUILDS LOOKS AT THE PROCESS.</text></svg>