<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="The Artifacts browser, simplified. On the left is a tree of repositories: a local repository, a remote repository cache, a virtual repository and a build-info repository, opening into folders and files. On the right are the details of the selected file: its repository path, size, creation date, who deployed it and its SHA-256, SHA-1 and MD5 checksums, with General and Properties tabs and actions to download, copy the path or deploy.">
