9.2</text><rect x="908" y="594" width="194" height="26" rx="13" fill="#EA80FC" fill-opacity="0.9"/><text x="1005" y="612" text-anchor="middle" font-family="SFMono-Regular, Consolas, Liberation Mono, Menlo, monospace" font-size="12.5" font-weight="800" fill="#2A0A3A">nginx 1.27</text><text x="600" y="660" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Open source you only downloaded was never built by your CI, so it has a package entry and no build of its own.</text></svg>