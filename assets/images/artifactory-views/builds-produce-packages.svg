<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-label="A timeline of four runs of a build job named payments-api, numbered 140 to 143 across four days. Each run produced one package version: 2.2.9, 2.3.0-rc1, 2.3.0 and 2.3.1. Below, a row of third-party packages such as spring-core, jackson, lodash, express and nginx, which appear in Packages but have no build row of their own because your CI only downloaded them.">
